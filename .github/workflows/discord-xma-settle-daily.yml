# After midnight Eastern: move the previous calendar day’s pending XMA into unclaimed and clear daily ledgers.
name: Discord XMA daily settlement

on:
  schedule:
    # 05:35 UTC ≈ 00:35 EST — settle “yesterday” in America/New_York; second run catches late-processed events.
    - cron: '35 5 * * *'
    - cron: '35 17 * * *'
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run settle-discord-xma-daily
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DAILY_GRANT_TIMEZONE: ${{ secrets.DAILY_GRANT_TIMEZONE }}
