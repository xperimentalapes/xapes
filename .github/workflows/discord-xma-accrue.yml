# Credits XMA from Discord engagement events (messages, reactions, voice) with per-user daily cap.
name: Discord XMA accrual

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  accrue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run accrue-discord-xma-rewards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_XMA_DAILY_ACCRUAL_CAP: ${{ secrets.DISCORD_XMA_DAILY_ACCRUAL_CAP }}
          DISCORD_XMA_PER_MESSAGE: ${{ secrets.DISCORD_XMA_PER_MESSAGE }}
          DISCORD_XMA_PER_REACTION: ${{ secrets.DISCORD_XMA_PER_REACTION }}
          DISCORD_XMA_PER_VOICE_MINUTE: ${{ secrets.DISCORD_XMA_PER_VOICE_MINUTE }}
