# Every 15 minutes: refresh `nfts` from Helius + reconcile Discord roles for all linked Discord users.
name: Sync NFTs and Discord roles

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/sync-nfts-roles.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          MUTANT_APES_COLLECTION_MINT: ${{ secrets.MUTANT_APES_COLLECTION_MINT }}
          COLLECTION_NAME: ${{ secrets.COLLECTION_NAME }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
