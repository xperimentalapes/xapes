# Discord Gateway worker (not the Vercel site).
# First-time setup: docs/deploy-discord-gateway-fly.md
app = "xapes-discord-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.gateway"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[vm]
  size = "shared-cpu-1x"
  memory = "256mb"
